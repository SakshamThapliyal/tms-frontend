<mat-card class="project-form-card">

  <mat-card-header>
    <mat-card-title>
      {{ isEdit ? 'Update Project' : 'Create Project' }}
    </mat-card-title>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>

    <form [formGroup]="projectForm" (ngSubmit)="save()">

      <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
        <mat-label>Project Name</mat-label>
        <input matInput formControlName="name" maxlength="200" placeholder="Enter project name" />
        <mat-error *ngIf="projectForm.get('name')?.hasError('required')">
          Project name is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" maxlength="1000" formControlName="description"
          placeholder="Enter project description"></textarea>
      </mat-form-field>

      <div class="row">

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Start Date</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="startDate">
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
          <mat-error *ngIf="projectForm.get('startDate')?.hasError('required')">
            Start date is required.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>End Date</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="endDate">
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>

      </div>

      <mat-divider></mat-divider>

      <div class="button-container">
        <button mat-flat-button color="warn" type="button" (click)="cancel()">
          <mat-icon>cancel</mat-icon>
          Cancel
        </button>
        <button mat-flat-button color="primary" type="submit">
          <mat-icon>save</mat-icon>
          {{ isEdit ? 'Update Project' : 'Save Project' }}
        </button>
      </div>

    </form>

  </mat-card-content>

</mat-card>
