<mat-card>

  <!-- Header -->

  <mat-card-header>

    <mat-card-title>

      {{ isEditMode ? 'Edit Task' : 'Add Task' }}

    </mat-card-title>

  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content>

    <form [formGroup]="taskForm" (ngSubmit)="submit()">

      <div class="form-grid">

        <!-- Title -->

        <mat-form-field appearance="outline">

          <mat-label>

            Title

          </mat-label>

          <input matInput formControlName="title">

          <mat-error *ngIf="taskForm.get('title')?.hasError('required')">

            Title is required.

          </mat-error>

        </mat-form-field>

        <!-- Status -->

        <mat-form-field appearance="outline">

          <mat-label>

            Status

          </mat-label>

          <mat-select formControlName="status">

            <mat-option *ngFor="let status of statuses" [value]="status">

              {{ status }}

            </mat-option>

          </mat-select>

        </mat-form-field>

        <!-- Priority -->

        <mat-form-field appearance="outline">

          <mat-label>

            Priority

          </mat-label>

          <mat-select formControlName="priority">

            <mat-option *ngFor="let priority of priorities" [value]="priority">

              {{ priority }}

            </mat-option>

          </mat-select>

        </mat-form-field>

        <!-- Project -->

        <mat-form-field appearance="outline">

          <mat-label>

            Project

          </mat-label>

          <mat-select formControlName="projectId">

            <mat-option *ngFor="let project of projects" [value]="project.projectId">

              {{ project.name }}

            </mat-option>

          </mat-select>

          <mat-error *ngIf="taskForm.get('projectId')?.hasError('required')">

            Project is required.

          </mat-error>

        </mat-form-field>

        <!-- Assigned User -->

        <mat-form-field appearance="outline">

          <mat-label>

            Assigned To

          </mat-label>

          <mat-select formControlName="assignedToUserId">

            <mat-option [value]="null">

              Unassigned

            </mat-option>

            <mat-option *ngFor="let user of users" [value]="user.userId">

              {{ user.fullName }}

            </mat-option>

          </mat-select>

        </mat-form-field>

        <!-- Due Date -->

        <mat-form-field appearance="outline">

          <mat-label>

            Due Date

          </mat-label>

          <input matInput [matDatepicker]="picker" formControlName="dueDate">

          <mat-datepicker-toggle matSuffix [for]="picker">

          </mat-datepicker-toggle>

          <mat-datepicker #picker></mat-datepicker>

        </mat-form-field>

      </div>

      <!-- Description -->

      <mat-form-field appearance="outline" class="full-width">

        <mat-label>

          Description

        </mat-label>

        <textarea matInput rows="5" formControlName="description">

        </textarea>

      </mat-form-field>

      <!-- Buttons -->

      <div class="button-container">

        <button mat-raised-button color="primary" type="submit">

          {{ isEditMode ? 'Update Task' : 'Create Task' }}

        </button>

        <button mat-raised-button color="warn" type="button" (click)="cancel()">

          Cancel

        </button>

      </div>

    </form>

  </mat-card-content>

</mat-card>
